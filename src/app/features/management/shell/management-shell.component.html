<div class="shell">
  <!-- Mobile sidebar overlay -->
  <div
    class="sidebar-overlay"
    [class.sidebar-overlay--visible]="sidebarOpen()"
    (click)="closeSidebar()"
    aria-hidden="true"
  ></div>

  <!-- Sidebar -->
  <aside class="sidebar" [class.sidebar--mobile-open]="sidebarOpen()">
    <!-- Logo -->
    <div class="sidebar__logo">
      <div class="logo-mark">C</div>
      <span class="logo-label">ChaseSpot POS</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar__nav" aria-label="Main navigation">
      @for (item of navItems; track item.label) {
        @if (item.children?.length) {
          <!-- Expandable group -->
          <div class="nav-group" *rbacAllow="item.roles ?? []">
            <button
              class="nav-item nav-group__trigger"
              [class.nav-group__trigger--active]="isGroupExpanded(item.label)"
              (click)="toggleGroup(item.label)"
              [attr.aria-expanded]="isGroupExpanded(item.label)"
              [attr.aria-label]="item.label"
            >
              <mat-icon class="nav-item__icon">{{ item.icon }}</mat-icon>
              <span class="nav-item__label">{{ item.label }}</span>
              <mat-icon class="nav-group__chevron">
                {{ isGroupExpanded(item.label) ? 'expand_less' : 'expand_more' }}
              </mat-icon>
            </button>
            @if (isGroupExpanded(item.label)) {
              <div class="nav-group__children">
                @for (child of item.children; track child.path) {
                  <a
                    class="nav-item nav-item--child"
                    [routerLink]="child.path"
                    routerLinkActive="nav-item--active"
                    *rbacAllow="child.roles ?? []"
                    [attr.aria-label]="child.label"
                    (click)="closeSidebar()"
                  >
                    <mat-icon class="nav-item__icon">{{ child.icon }}</mat-icon>
                    <span class="nav-item__label">{{ child.label }}</span>
                  </a>
                }
              </div>
            }
          </div>
        } @else {
          <!-- Regular nav link -->
          <a
            class="nav-item"
            [routerLink]="item.path"
            routerLinkActive="nav-item--active"
            [matTooltip]="item.label"
            *rbacAllow="item.roles ?? []"
            matTooltipPosition="right"
            [matTooltipDisabled]="true"
            [attr.aria-label]="item.label"
            (click)="closeSidebar()"
          >
            <mat-icon class="nav-item__icon">{{ item.icon }}</mat-icon>
            <span class="nav-item__label">{{ item.label }}</span>
          </a>
        }
      }
    </nav>

    <!-- Bottom: cashier switch -->
    <div *rbacAllow="['superAdmin']" class="sidebar__footer">
      <button
        mat-button
        class="switch-btn"
        (click)="goToCashier()"
        matTooltip="Switch to Cashier View"
      >
        <mat-icon>point_of_sale</mat-icon>
        <span>Cashier View</span>
      </button>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <!-- Header -->
    <header class="header">
      <div class="header__left">
        <button
          mat-icon-button
          class="menu-toggle"
          (click)="toggleSidebar()"
          aria-label="Toggle navigation menu"
        >
          <mat-icon>{{ sidebarOpen() ? 'close' : 'menu' }}</mat-icon>
        </button>
        <h1 class="header__title">{{ pageTitle() }}</h1>
      </div>

      <div class="header__actions">
        <!-- Store selector -->
        <!-- <button mat-stroked-button class="store-btn" [matMenuTriggerFor]="storeMenu">
          {{ currentUser()?.store ?? 'Select store' }}
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
        <mat-menu #storeMenu="matMenu">
          <button mat-menu-item>Delect</button>
          <button mat-menu-item>Branch 2</button>
        </mat-menu> -->

        <!-- Help -->
        <!-- <button mat-icon-button matTooltip="Help" aria-label="Help">
          <mat-icon>help_outline</mat-icon>
        </button> -->

        <!-- Notifications -->
        <button
          mat-icon-button
          matTooltip="Notifications"
          aria-label="Notifications"
          [matBadge]="notifications()"
          matBadgeColor="warn"
          matBadgeSize="small"
        >
          <mat-icon>notifications_none</mat-icon>
        </button>

        <!-- User menu -->
        <button mat-button class="user-btn" [matMenuTriggerFor]="userMenu">
          <img
            class="user-btn__avatar"
            [src]="currentUser()?.avatar || 'https://i.pravatar.cc/40?u=' + currentUser()?.email"
            [alt]="currentUser()?.firstName + ' ' + currentUser()?.lastName"
          />
          <span class="user-btn__name"
            >{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</span
          >
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item><mat-icon>person</mat-icon> Profile</button>
          <button mat-menu-item><mat-icon>settings</mat-icon> Settings</button>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()"><mat-icon>logout</mat-icon> Sign out</button>
        </mat-menu>
      </div>
    </header>

    <!-- Page content -->
    <main class="content page-enter">
      <router-outlet />
    </main>
  </div>
</div>
